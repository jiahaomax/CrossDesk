[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/transport", "crates/daemon", "apps/desktop/src-tauri"]
default-members = ["crates/core", "crates/platform", "crates/transport", "crates/daemon"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
crossdesk-core = { path = "crates/core" }
crossdesk-platform = { path = "crates/platform" }
crossdesk-transport = { path = "crates/transport" }


