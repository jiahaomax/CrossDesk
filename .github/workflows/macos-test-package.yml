name: CrossDesk Test Mac packages
on:
  workflow_dispatch:
  push:
    branches: ['codex/macos-test-*']
permissions:
  contents: read
concurrency:
  group: macos-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/macos-test-signing.py build
        env:
          CROSSDESK_TEST_CERT_P12: ${{ secrets.CROSSDESK_TEST_CERT_P12 }}
          CROSSDESK_TEST_CERT_PASSWORD: ${{ secrets.CROSSDESK_TEST_CERT_PASSWORD }}
          CROSSDESK_TEST_CERT_SHA256: ${{ vars.CROSSDESK_TEST_CERT_SHA256 }}
      - uses: actions/upload-artifact@v4
        with:
          name: CrossDesk-Test-${{ runner.arch }}
          path: dist/CrossDesk-Test-*-Mac-*.zip
          if-no-files-found: error
