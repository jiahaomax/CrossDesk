[package]
name = "crossdesk-platform"
version.workspace = true
edition.workspace = true
[features]
test-profile = ["crossdesk-core/test-profile"]
[dependencies]
crossdesk-core.workspace = true
anyhow.workspace = true
serde.workspace = true
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Security", "Win32_Storage_FileSystem"] }
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
security-framework = "3"
