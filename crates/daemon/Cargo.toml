[package]
name = "crossdesk-daemon"
version.workspace = true
edition.workspace = true
[features]
test-profile = ["crossdesk-core/test-profile", "crossdesk-platform/test-profile", "crossdesk-transport/test-profile"]
[dependencies]
crossdesk-core.workspace = true
crossdesk-platform.workspace = true
crossdesk-transport.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rand = "0.9"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
mdns-sd = "0.19"
# Already used by mdns-sd; pin the existing locked version for local IP display.
if-addrs = "=0.15.0"
